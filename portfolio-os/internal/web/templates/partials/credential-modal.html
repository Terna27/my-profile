{{ define "credential-modal" }}
<!-- Unified Accessible Detail Dialog -->
<div
  id="credential-detail-modal"
  class="credential-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modal-cred-title"
  aria-describedby="modal-cred-desc"
  hidden
>
  <div class="credential-modal-backdrop" data-close-credential></div>
  <div class="credential-modal-dialog" role="document">
    <button
      type="button"
      class="credential-modal-close"
      data-close-credential
      aria-label="Close dialog (Escape)"
    >
      <span aria-hidden="true">&times;</span>
    </button>

    <div class="credential-modal-scrollable">
      <div class="credential-modal-content">
        <!-- Artwork Media Viewer -->
        <div class="credential-modal-media">
          <img
            id="modal-cred-img"
            src=""
            alt=""
            class="modal-artwork-img"
          />
          <div id="modal-cred-fallback" class="modal-artwork-fallback" style="display:none;" aria-hidden="true">
            <span id="modal-cred-glyph">📜</span>
          </div>
        </div>

        <!-- Comprehensive Details Info Panel -->
        <div class="credential-modal-info">
          <div class="modal-eyebrow-row">
            <span id="modal-cred-type" class="modal-type-badge">CERTIFICATE</span>
            <span id="modal-cred-issuer" class="modal-issuer"></span>
          </div>

          <h3 id="modal-cred-title" class="modal-title"></h3>

          <div id="modal-cred-meta-row" class="modal-meta-row">
            <div id="modal-cred-date-wrap" class="modal-meta-pill">
              <span class="meta-icon" aria-hidden="true">📅</span>
              <span id="modal-cred-date"></span>
            </div>
            <div id="modal-cred-id-wrap" class="modal-meta-pill">
              <span class="meta-label">ID:</span>
              <code id="modal-cred-id"></code>
            </div>
          </div>

          <div id="modal-cred-desc-wrap" class="modal-desc-wrap">
            <h4 class="modal-desc-heading">Description &amp; Verified Skills</h4>
            <p id="modal-cred-desc" class="modal-desc-text"></p>
          </div>

          <div class="modal-footer-actions">
            <a
              id="modal-cred-verify-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="modal-btn-verify"
            >
              <span>Verify credential on registry</span>
              <span class="btn-arrow" aria-hidden="true">↗</span>
            </a>
            <button
              type="button"
              class="modal-btn-close-subtle"
              data-close-credential
            >
              Close preview
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
